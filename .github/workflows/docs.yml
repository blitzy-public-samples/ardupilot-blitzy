name: documentation

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# Cancel any in-progress runs for the same workflow and branch
concurrency:
  group: ci-${{github.workflow}}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    runs-on: ubuntu-22.04
    container:
      image: ardupilot/ardupilot-dev-base:v0.1.3
      options: --privileged
    
    env:
      DOCS_OUTPUT_BASE: ${{ github.workspace }}/build/docs
    
    steps:
      # Checkout repository with all submodules for complete documentation build
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      
      # Configure git to trust the workspace directory
      - name: Configure git safe directory
        run: |
          git config --global --add safe.directory ${GITHUB_WORKSPACE}
      
      # Install documentation build dependencies
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            doxygen \
            graphviz \
            nodejs \
            npm \
            python3 \
            python3-pip
          npm install -g markdownlint-cli
      
      # Create output directory for documentation
      - name: Create documentation output directory
        run: |
          mkdir -p ${DOCS_OUTPUT_BASE}
      
      # Build library documentation first (generates tag file for cross-references)
      - name: Build library documentation
        run: |
          echo "Building library documentation..."
          ./docs/build-libs.sh
          echo "Library documentation build complete"
      
      # Build ArduCopter documentation
      - name: Build ArduCopter documentation
        run: |
          echo "Building ArduCopter documentation..."
          ./docs/build-arducopter.sh
          echo "ArduCopter documentation build complete"
      
      # Build ArduPlane documentation
      - name: Build ArduPlane documentation
        run: |
          echo "Building ArduPlane documentation..."
          ./docs/build-arduplane.sh
          echo "ArduPlane documentation build complete"
      
      # Build Rover documentation
      - name: Build Rover documentation
        run: |
          echo "Building Rover documentation..."
          ./docs/build-apmrover2.sh
          echo "Rover documentation build complete"
      
      # Build ArduSub documentation
      - name: Build ArduSub documentation
        run: |
          echo "Building ArduSub documentation..."
          ./docs/build-ardusub.sh
          echo "ArduSub documentation build complete"
      
      # Check for Doxygen warnings and enforce zero-warning policy
      - name: Check Doxygen warnings
        run: |
          echo "Checking for Doxygen warnings..."
          if [ -f ${DOCS_OUTPUT_BASE}/build_docs.log ]; then
            WARNING_COUNT=$(grep -c "warning:" ${DOCS_OUTPUT_BASE}/build_docs.log || true)
            echo "Found ${WARNING_COUNT} Doxygen warnings"
            
            if [ ${WARNING_COUNT} -gt 0 ]; then
              echo "ERROR: Doxygen warnings detected. Zero-warning policy enforced."
              echo "Please fix the following warnings:"
              grep "warning:" ${DOCS_OUTPUT_BASE}/build_docs.log || true
              exit 1
            fi
            
            echo "✅ No Doxygen warnings detected"
          else
            echo "Warning: build_docs.log not found, skipping warning check"
          fi
      
      # Validate Markdown syntax across repository
      - name: Validate Markdown syntax
        run: |
          echo "Validating Markdown syntax..."
          markdownlint '**/*.md' \
            --ignore node_modules \
            --ignore modules \
            --ignore build \
            --config .markdownlint.json || {
              # If config doesn't exist, use default rules with some relaxations
              markdownlint '**/*.md' \
                --ignore node_modules \
                --ignore modules \
                --ignore build \
                --disable MD013 MD033 MD041 || true
            }
          echo "✅ Markdown validation complete"
      
      # Generate documentation coverage report
      - name: Check documentation coverage
        continue-on-error: true
        run: |
          echo "Generating documentation coverage report..."
          if [ -f Tools/scripts/doc_coverage.py ]; then
            python3 Tools/scripts/doc_coverage.py --report || {
              echo "Note: doc_coverage.py script not yet implemented"
              echo "Documentation coverage checking will be available in future updates"
            }
          else
            echo "Note: doc_coverage.py script not yet available"
            echo "Documentation coverage checking will be implemented in future updates"
          fi
      
      # Upload generated HTML documentation as artifacts
      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ardupilot-documentation
          path: |
            ${{ github.workspace }}/build/docs/libraries/html
            ${{ github.workspace }}/build/docs/arducopter/html
            ${{ github.workspace }}/build/docs/arduplane/html
            ${{ github.workspace }}/build/docs/apmrover2/html
            ${{ github.workspace }}/build/docs/ardusub/html
          retention-days: 7
          if-no-files-found: warn
      
      # Print summary report
      - name: Print documentation build summary
        if: always()
        run: |
          echo "================================================"
          echo "Documentation Build Summary"
          echo "================================================"
          echo ""
          echo "Generated documentation locations:"
          echo "  - Libraries: ${DOCS_OUTPUT_BASE}/libraries/html/index.html"
          echo "  - ArduCopter: ${DOCS_OUTPUT_BASE}/arducopter/html/index.html"
          echo "  - ArduPlane: ${DOCS_OUTPUT_BASE}/arduplane/html/index.html"
          echo "  - Rover: ${DOCS_OUTPUT_BASE}/apmrover2/html/index.html"
          echo "  - ArduSub: ${DOCS_OUTPUT_BASE}/ardusub/html/index.html"
          echo ""
          
          if [ -f ${DOCS_OUTPUT_BASE}/build_docs.log ]; then
            echo "Build log available at: ${DOCS_OUTPUT_BASE}/build_docs.log"
          fi
          
          echo ""
          echo "Documentation artifacts uploaded for 7-day retention"
          echo "Download artifacts from the Actions tab to view generated docs"
          echo "================================================"
